# InfinityFree / GitHub Actions — chạy collector mỗi 15 phút.
# InfinityFree KHÔNG có cron (tắt từ 09/08/2023) nên scheduler phải chạy ở đây.
name: collect-tech-news

on:
  schedule:
    - cron: "*/15 * * * *" # mỗi 15 phút (tin)
    - cron: "0 1 * * *"    # 01:00 UTC mỗi ngày (giá — xem step prices)
  workflow_dispatch: # chạy tay để kiểm tra

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r collector/requirements.txt

      - name: Collect RSS + APIs (tin)
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
        run: python3 collector/collector.py --limit 20

      - name: Collect prices (chỉ 1 lần/ngày, lúc 01:00 UTC)
        if: github.event.schedule == '0 1 * * *' || github.event_name == 'workflow_dispatch'
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: python3 collector/collector.py --limit 5 --prices
