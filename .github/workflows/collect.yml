# TinkerHost / GitHub Actions — chạy collector mỗi 15 phút.
# Host KHÔNG có cron nên scheduler phải chạy ở đây.
# Tin + giá chạy CHUNG trong 1 process / 1 lần POST: host chỉ cho qua
# 1 lần giải challenge AES (?i=1) mỗi lượt — lần POST thứ 2 trong cùng
# 1 run luôn bị front proxy trả 400 (thực nghiệm run #4, #6).
name: collect-tech-news

on:
  schedule:
    - cron: "*/15 * * * *" # mỗi 15 phút (tin + giá)
  workflow_dispatch: # chạy tay để kiểm tra

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r collector/requirements.txt

      - name: Collect RSS + APIs (tin + giá)
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
        run: python3 collector/collector.py --limit 20 --prices
